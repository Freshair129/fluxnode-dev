[package]
name = "fluxnode"
version = "0.1.0"
description = "FluxNode desktop shell"
authors = ["Boss"]
edition = "2021"

[lib]
name = "fluxnode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# In-process llama.cpp brain backend. OFF by default because llama-cpp-2 builds llama.cpp from
# source and needs a C++ toolchain (cmake + MSVC/clang + libclang) plus a GGUF model. Enable with
# `cargo build --features llama` on a machine with the toolchain, then add the `llama-cpp-2` dep
# and flesh out `brain/llama.rs`. See docs/AI Copilot Binary Setup.md.
llama = []

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
tauri = { version = "2.1.1", features = ["protocol-asset"] }
rmcp = { version = "0.16", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
keyring = "2"
